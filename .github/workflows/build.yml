# ─────────────────────────────────────────────────────
# liu-PTR CI/CD 工作流
# ─────────────────────────────────────────────────────
# 触发规则：
#   - Push 到 master → 测试 + Web 部署
#   - PR 到 master → 仅测试
#   - 打 tag (v*) → 测试 + Web + Android APK + 创建 Release
# ─────────────────────────────────────────────────────

name: Build & Deploy

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

# 并发控制：同一分支只保留最新构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 测试 ──────────────────────────────────────────────
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npx jest --no-cache --verbose

      - name: Run lint
        run: npm run lint
        continue-on-error: true

  # ── Web 构建 & 部署 ──────────────────────────────────
  build-web:
    name: 🌐 Build & Deploy Web
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web
        run: npx expo export --platform web

      - name: Fix asset paths for GitHub Pages subdirectory
        run: |
          python3 -c "
          import glob, os, shutil, re
          BASE = '/liu-PTR'

          # Routing script: override location.pathname getter + patch pushState/replaceState
          SCRIPT = '''(function(){
            var B='BASE_PLACEHOLDER', _loc=window.location, _proto=_loc.__proto__||{};
            var _origGet=Object.getOwnPropertyDescriptor(_proto,'pathname');
            if(_origGet&&_origGet.get){
              Object.defineProperty(_proto,'pathname',{
                get:function(){
                  var p=_origGet.get.call(_loc);
                  if(p.startsWith(B+'/'))return p.slice(B.length);
                  if(p===B)return '/';
                  return p;
                },configurable:true
              });
            }
            var _P=history.pushState.bind(history),_R=history.replaceState.bind(history);
            function addB(u){return(typeof u==='string'&&u.startsWith('/')&&!u.startsWith(B+'/'))?B+u:u}
            history.pushState=function(s,t,u){return _P(s,t,addB(u))};
            history.replaceState=function(s,t,u){return _R(s,t,addB(u))};
          })()'''.replace('BASE_PLACEHOLDER', BASE)

          for f in glob.glob('dist/**/*.html', recursive=True):
              with open(f) as fh: c = fh.read()
              c = c.replace('src=\"/_expo/', 'src=\"' + BASE + '/_expo/')
              c = c.replace('href=\"/_expo/', 'href=\"' + BASE + '/_expo/')
              c = c.replace('href=\"/assets/', 'href=\"' + BASE + '/assets/')
              c = c.replace('src=\"/assets/', 'src=\"' + BASE + '/assets/')
              c = c.replace('href=\"/favicon', 'href=\"' + BASE + '/favicon')
              c = c.replace('<head>', '<head><script>' + SCRIPT + '</script>', 1)
              with open(f, 'w') as fh: fh.write(c)

          for f in glob.glob('dist/_expo/static/js/web/*.js'):
              with open(f) as fh: c = fh.read()
              c = c.replace('\"/assets/', '\"' + BASE + '/assets/')
              with open(f, 'w') as fh: fh.write(c)

          shutil.copy('dist/index.html', 'dist/404.html')
          print('✅ All paths fixed + routing script injected + 404.html')
          "

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  # ── Android APK 构建 ─────────────────────────────────
  build-android:
    name: 🤖 Build Android APK
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90

  # ── 创建 Release ─────────────────────────────────────
  release:
    name: 📦 Create Release
    needs: [test, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk

      - name: Rename APK
        run: mv app-release.apk liu-PTR-${{ github.ref_name }}.apk

      - name: Generate Release Notes
        id: notes
        run: |
          # 获取上一个 tag
          PREV_TAG=$(git tag --sort=-creatordate | head -2 | tail -1)
          if [ "$PREV_TAG" = "${{ github.ref_name }}" ]; then
            PREV_TAG=""
          fi

          # 生成变更日志
          echo "## 🚀 What's Changed" > release_notes.md
          echo "" >> release_notes.md

          if [ -n "$PREV_TAG" ]; then
            echo "### Commits since $PREV_TAG" >> release_notes.md
            git log ${PREV_TAG}..${{ github.ref_name }} --pretty=format:"- %s (%h)" >> release_notes.md
          else
            echo "### Initial Release" >> release_notes.md
            echo "- 🎉 首个发布版本" >> release_notes.md
          fi

          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "## 📦 Downloads" >> release_notes.md
          echo "" >> release_notes.md
          echo "| 文件 | 说明 |" >> release_notes.md
          echo "|------|------|" >> release_notes.md
          echo "| \`liu-PTR-${{ github.ref_name }}.apk\` | Android APK 安装包 |" >> release_notes.md
          echo "| \`Source code\` | 源代码 |" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "## 🌐 Web 版本" >> release_notes.md
          echo "" >> release_notes.md
          echo "👉 [在线体验](https://liujunxiang0076.github.io/liu-PTR/web/)" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "## 📱 安装说明" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Android" >> release_notes.md
          echo "1. 下载 \`liu-PTR-${{ github.ref_name }}.apk\`" >> release_notes.md
          echo "2. 在手机上打开 APK 文件" >> release_notes.md
          echo "3. 允许安装未知来源应用" >> release_notes.md
          echo "4. 完成安装" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Web" >> release_notes.md
          echo "直接访问：https://liujunxiang0076.github.io/liu-PTR/web/" >> release_notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: liu-PTR ${{ github.ref_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: |
            liu-PTR-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        run: rm -f release_notes.md
